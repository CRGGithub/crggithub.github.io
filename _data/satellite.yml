# EUMETSAT WMS products served from view.eumetsat.int/geoserver/wms
#
# IMPORTANT: this GeoServer renders only the FIRST layer of a multi-layer
# GetMap request - ask for four layers and you get the first one back, with no
# error. So every layer here is requested separately and the browser stacks
# the results. That is why a product has one `base` and at most one `overlay`
# rather than a comma-separated list.
#
# `cadence` is the instrument repeat cycle in minutes; `lag` is how far behind
# real time to ask, so the slot requested is one the archive has finished
# ingesting.

# Static vector layers drawn over every product, listed bottom-up so the
# faint provincial lines sit under the brighter national ones.
boundaries:
  - id: provinces
    layer: "osmgray:ne_10m_admin_1_states_provinces_lines"
    label: Provinces and states
  - id: countries
    layer: "backgrounds:ne_boundary_lines_land"
    label: Country borders
  - id: coastline
    layer: "backgrounds:ne_10m_coastline"
    label: Coastline

views:
  - id: southern-africa
    title: Southern Africa
    crs: "EPSG:4326"
    bbox: "-38,8,-14,44"
    width: 1400
    height: 933
  - id: south-africa
    title: South Africa
    crs: "EPSG:4326"
    bbox: "-36,14,-21,35"
    width: 1400
    height: 1000
  - id: highveld
    title: Highveld and radar range
    crs: "EPSG:4326"
    bbox: "-29.5,22,-22.5,32"
    width: 1400
    height: 980
  - id: full-disc
    title: Full disc
    crs: "AUTO:97004,9001,0,0"
    bbox: "-2200000,-4000000,4900000,4000000"
    width: 1400
    height: 1633

products:
  - id: geocolour
    title: GeoColour + Lightning
    satellite: MTG-I FCI
    base: "mtg_fd:rgb_geocolour"
    overlay: "mtg_fd:li_afa"
    overlay_cadence: 5
    cadence: 10
    lag: 40
    default: true
    blurb: >-
      True colour by day, an infrared and city-lights blend by night, with
      Lightning Imager accumulated flash area painted on top. The single best
      all-hours situational picture.

  - id: convection
    title: Convection RGB
    satellite: MSG SEVIRI
    base: "msg_fes:rgb_convection"
    cadence: 15
    lag: 45
    blurb: >-
      The classic severe-storm recipe. Vigorous, small-ice-topped convection
      turns bright yellow; deep but less intense cloud stays white or red.

  - id: rdt
    title: Rapidly Developing Thunderstorms
    satellite: MSG SEVIRI
    base: "msg_fes:ir108"
    overlay: "msg_fes:rdt"
    overlay_cadence: 15
    cadence: 15
    lag: 45
    blurb: >-
      Automatically detected and tracked convective cells outlined over the
      10.8 µm infrared image, colour-coded by phase of the storm life cycle.
      Nothing is drawn when no cells are being tracked.

  - id: kindex
    title: K-Index instability
    satellite: MSG GII
    base: "msg_fes:gii_kindex"
    cadence: 15
    lag: 60
    blurb: >-
      Satellite-retrieved K-Index in clear air. High values flag the
      moist, unstable air masses that thunderstorms grow in - a useful
      cross-check on the WRF CAPE fields.

  - id: wv062
    title: Water Vapour 6.2 µm
    satellite: MSG SEVIRI
    base: "msg_fes:wv062"
    cadence: 15
    lag: 45
    blurb: >-
      Upper-tropospheric moisture. Dark bands are dry, sinking air; the sharp
      edges between dark and bright trace the jet stream and short waves.

  - id: airmass
    title: Airmass RGB
    satellite: MSG SEVIRI
    base: "msg_fes:rgb_airmass"
    cadence: 15
    lag: 45
    blurb: >-
      Separates warm, moist tropical air (green) from cold, dry polar and
      stratospheric air (blue and red). Red streaks mark tropopause folds
      ahead of developing cut-off lows.

  - id: ir105
    title: Infrared 10.5 µm
    satellite: MTG-I FCI
    base: "mtg_fd:ir105_hrfi"
    cadence: 10
    lag: 40
    blurb: >-
      Brightness temperature of whatever the satellite can see. The coldest,
      whitest tops are the highest and usually the most active storms.

  - id: dust
    title: Dust RGB
    satellite: MTG-I FCI
    base: "mtg_fd:rgb_dust"
    cadence: 10
    lag: 40
    blurb: >-
      Lifted dust shows magenta, thin high cloud black, thick cloud red-brown.
      Also a good low-cloud and fog discriminator overnight.

  - id: truecolour
    title: True Colour
    satellite: MTG-I FCI
    daylight_only: true
    base: "mtg_fd:rgb_truecolour"
    cadence: 10
    lag: 40
    blurb: >-
      Unenhanced visible imagery, closest to what the eye would see from
      orbit. Daylight only - it goes black after sunset.

  - id: fire
    title: Fire Radiative Power
    satellite: MTG-I FCI
    base: "mtg_fd:rgb_geocolour"
    overlay: "mtg_fd:frp"
    overlay_cadence: 10
    cadence: 10
    lag: 40
    blurb: >-
      Detected active fires and their radiative power over the GeoColour
      background - relevant through the dry Highveld burning season.
