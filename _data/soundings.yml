# Forecast Skew-T / log-p soundings, grouped by the WRF domain that
# produces them. `page` is relative to {{ site.data_host }}/wrf/
groups:
  - domain: d03
    resolution: 3 km
    title: North West and Gauteng
    blurb: >-
      Convection-permitting soundings from the 3 km nest. This is the domain to
      use for thunderstorm timing and mode over the Highveld.
    stations:
      - { name: Potchefstroom, page: nwgp_wrfskwt_potchefstroom.html }
      - { name: Mahikeng,      page: nwgp_wrfskwt_mahikeng.html }
      - { name: Vanderbijlpark, page: nwgp_wrfskwt_vanderbijlpark.html }
      - { name: Vereeniging,   page: nwgp_wrfskwt_vereeniging.html }
      - { name: Klerksdorp,    page: nwgp_wrfskwt_klerksdorp.html }
      - { name: Rustenburg,    page: nwgp_wrfskwt_rustenburg.html }
      - { name: Brits,         page: nwgp_wrfskwt_brits.html }
      - { name: Lichtenburg,   page: nwgp_wrfskwt_lichtenburg.html }
      - { name: Vryburg,       page: nwgp_wrfskwt_vryburg.html }
      - { name: Zeerust,       page: nwgp_wrfskwt_zeerust.html }
      - { name: Pretoria,      page: nwgp_wrfskwt_pretoria.html }
      - { name: Centurion,     page: nwgp_wrfskwt_centurion.html }
      - { name: Johannesburg,  page: nwgp_wrfskwt_johannesburg.html }
      - { name: Soweto,        page: nwgp_wrfskwt_soweto.html }
      - { name: Krugersdorp,   page: nwgp_wrfskwt_krugersdorp.html }
      - { name: Benoni,        page: nwgp_wrfskwt_benoni.html }

  - domain: d02
    resolution: 9 km
    title: South Africa and neighbours
    blurb: >-
      Soundings from the 9 km outer domain, covering the South African
      upper-air network plus Maputo, Maseru and Mbabane.
    stations:
      - { name: Irene,         page: wrfskwt_irene.html }
      - { name: Bethlehem,     page: wrfskwt_bethlehem.html }
      - { name: Bloemfontein,  page: wrfskwt_bloemfontein.html }
      - { name: Mafikeng,      page: wrfskwt_mafikeng.html }
      - { name: Polokwane,     page: wrfskwt_polokwane.html }
      - { name: Rustenburg,    page: wrfskwt_rustenburg.html }
      - { name: Durban,        page: wrfskwt_durban.html }
      - { name: Gqeberha,      page: wrfskwt_gqeberha.html }
      - { name: Cape Town,     page: wrfskwt_cpt.html }
      - { name: De Aar,        page: wrfskwt_deaar.html }
      - { name: Upington,      page: wrfskwt_upington.html }
      - { name: Springbok,     page: wrfskwt_springbok.html }
      - { name: Alexander Bay, page: wrfskwt_alexander.html }
      - { name: Sutherland,    page: wrfskwt_sutherland.html }
      - { name: Mata-Mata,     page: wrfskwt_mata.html }
      - { name: Maseru,        page: wrfskwt_maseru.html }
      - { name: Mbabane,       page: wrfskwt_mbabane.html }
      - { name: Maputo,        page: wrfskwt_maputu.html }
