# The NWU operational WRF-ARW configuration, mirroring the product index
# published by the model server at {{ site.data_host }}/wrf/index.html
version: "WRF-ARW 4.8.0"
init: "NCEP GFS 0.25 deg, 3-hourly"
length: "72 h"

# The GFS cycles the model is initialised from each day, in run order. This
# is the ONLY place they are written - the home page badge, the WRF stat tile
# and the configuration table all read them from here.
#
# Maintained by hand, by choice. The model server's status.json reports only
# the cycle of the *latest* run, so it cannot describe a twice-daily schedule
# on its own, and in any case the browser cannot read it: plain http, no CORS
# headers, blocked on the https site before CORS is even considered.
#
# So: when the operational schedule changes, edit this list.
cycles: ["00Z", "12Z"]

domains:
  - id: d02
    label: Outer domain
    resolution: 9 km
    grid: 214 x 200
    extent: "14.7-36.1E, 20.5-36.9S"
    coverage: South Africa, Lesotho and Eswatini
    note: Forced directly from GFS at the lateral boundary; cumulus parameterised
    published: true
  - id: d03
    label: Convection-permitting nest
    resolution: 3 km
    grid: 246 x 156
    extent: "21.9-29.4E, 23.6-27.9S"
    coverage: North West and Gauteng
    note: Cumulus scheme off - convection resolved explicitly
    published: true

physics:
  - name: Dynamical core
    value: WRF-ARW v4.8.0, non-hydrostatic
  - name: Map projection
    value: Lambert Conformal (true latitudes -23.7 and -34.0)
  - name: Microphysics
    value: Thompson (mp_physics = 6)
  - name: Cumulus
    value: Kain-Fritsch on d02, off on d03
  - name: Longwave radiation
    value: RRTMG (ra_lw_physics = 3)
  - name: Shortwave radiation
    value: RRTMG (ra_sw_physics = 3)
  - name: Planetary boundary layer
    value: YSU (bl_pbl_physics = 1)
  - name: Surface layer
    value: Revised MM5 Monin-Obukhov (sf_sfclay_physics = 1)
  - name: Land surface
    value: Unified Noah LSM (sf_surface_physics = 2), 4 soil layers
  - name: Initial and boundary conditions
    value: NCEP GFS 0.25 deg, 3-hourly

# The synoptic overview plot. It has no nwgp_ (3 km) counterpart, so it lives
# on its own key rather than in `fields`, which assumes both resolutions exist.
overview:
  page: wrfoverview.html
  title: WRF Synoptic Overview
  scale: 9 km
  domain: d02
  coverage: South Africa, Lesotho and Eswatini
  blurb: >-
    Mean sea-level pressure, 10 m wind, dew point and 6-hourly precipitation,
    over 500 hPa geopotential height and vorticity and the 850 hPa wind and
    relative humidity.

# Not a WRF product either: the same overview layout drawn straight from the
# GFS fields that force the model, over a far wider region than any WRF domain.
# It took over the synoptic-scale job when the 18 km outer domain was retired.
gfs_overview:
  page: gfsoverview.html
  title: GFS Large-Scale Overview
  scale: 0.25 deg
  coverage: "10W-65E, 48S-15N"
  blurb: >-
    The same surface and upper-air layout as the WRF overview, rendered from
    the raw NCEP GFS boundary-forcing data across the wider region the model
    sits inside.

# Not a WRF product. The model server mirrors the official South African
# Weather Service warnings alongside the forecast, filtered to the current
# cycle's window, and this links to that page. Kept off `overview` and `fields`
# so nothing on our side presents it as model output.
warnings:
  page: wrfwarnings.html
  map_page: wrfwarnings_map.html
  title: SAWS Severe Weather Warnings
  blurb: >-
    Official impact-based warnings on an interactive map, filtered to the
    current forecast window.

dashboards:
  - page: impact_dashboard.html
    title: National Impact Dashboard
    scale: 9 km
    blurb: >-
      Eighteen towns - the 9 km sounding sites - scored for convection,
      rainfall, wind, heat stress (Heat Index and WBGT), livestock heat load
      (THI), frost, fire danger, spray windows and irrigation scheduling.
  - page: nwu_dashboard.html
    title: NWU Campus Dashboard
    scale: 3 km
    blurb: >-
      Convection-permitting guidance for the Potchefstroom, Mahikeng and
      Vanderbijlpark (Vaal) campuses, scored against the same hazards as the
      national dashboard.

# Agri forecast, developed under the Maize Trust Early Warning for Farmers
# project. A town dashboard for the summer-grain region plus regional maps, all
# on the 9 km domain, so like the overview it sits on its own key rather than
# in `fields`. Keep the project credit: it is how the work is funded.
#
# Map `page`s name the static image page. The site links to its interactive
# twin, the same name with _map before .html - see `static_maps` below.
agri:
  project: Maize Trust Early Warning for Farmers
  dashboard:
    page: agri_dashboard.html
    title: Agri forecast
    scale: 9 km
    blurb: >-
      Twenty-nine grain towns in the Maize Triangle, the summer-grain
      region, over the next three days: spray windows, planting rain, field
      access, irrigation need, crop-disease weather, frost and crop heat.
  maps:
    - page: agri_rain.html
      title: Rain per day
      blurb: Gauge-day rainfall against the 25 mm planting-rain threshold.
    - page: agri_spray.html
      title: Spray conditions
      blurb: Hourly Delta-T, wind and rain against spraying limits.
    - page: agri_access.html
      title: Field access
      blurb: Topsoil moisture against field capacity, for trafficability.
    - page: agri_irrigation.html
      title: Irrigation need
      blurb: Mid-season maize water use (FAO-56) less effective rain.
    - page: agri_leafwet.html
      title: Leaf-wetness hours
      blurb: Hours of likely leaf wetness, against rust and leaf-blight thresholds.
    - page: agri_soiltemp.html
      title: Soil temperature
      blurb: 0-10 cm at 08:00 SAST, against germination and emergence bases.
    - page: agri_tmin.html
      title: Night minimum
      blurb: Lowest overnight temperature, against frost thresholds.
    - page: agri_tmax.html
      title: Day maximum
      blurb: Highest daytime temperature, against crop heat-stress thresholds.

# Event forecasts (event_*.html on the model server - God's Window, Aardklop,
# a cricket ODI and so on) are deliberately NOT mirrored on this site: the
# owner's decision, September 2026. Leave them out when syncing with the portal.

# Severe Convective Environment Potential. 9 km only, and the successor to the
# withdrawn impact-based convective forecast - but built the opposite way: SCEP
# is an ingredients diagnostic scored against fixed physical thresholds, where
# the old product was statistically fitted.
#
# `note` reproduces the model server's own caveat. It matters more here than on
# most products: a 0-100 number invites reading as a probability, and this one
# is not calibrated against any storm record. Do not paraphrase it away.
severe:
  page: wrfscep.html
  map_page: wrfscep_map.html
  radar_map_page: wrfscep_radar_map.html
  title: Severe Convective Environment (SCEP)
  scale: 9 km
  status: Experimental
  blurb: >-
    How supportive the atmosphere is for a storm that forms to turn severe, on
    a 0-100 scale, from instability aloft, shear, low-level moisture and
    freezing level.
  note: >-
    Not historically trained, not a calibrated probability, not a warning.

# Every gridded field and every agri map now has an interactive twin - a
# Leaflet map over an OpenStreetMap basemap, with a frame slider - named like
# its static page with _map before .html (wrftemp.html -> wrftemp_map.html,
# nwgp_wrftemp.html -> nwgp_wrftemp_map.html). The site links the interactive
# version. The static image pages are still generated every run, and the model
# server indexes all of them on this one page.
static_maps: static_maps.html

# Gridded fields. `page` is the 9 km static product; the 3 km nest uses the
# same name with an nwgp_ prefix. The site links the interactive twins - see
# `static_maps` above.
fields:
  - page: wrfradar.html
    title: Simulated Radar
    blurb: Model-simulated radar reflectivity.
  - page: wrfrainfall.html
    title: Accumulated Precipitation
    blurb: Precipitation accumulated from model initialisation.
  - page: wrfcape.html
    title: Simulated CAPE
    blurb: Convective available potential energy.
  - page: wrfhail.html
    title: Hail Forecast
    blurb: Maximum hailstone diameter at the surface, from the HAILCAST model.
  - page: wrfwindspeed.html
    title: Max Wind Gust (Beaufort)
    blurb: >-
      Peak surface gust in each output interval, banded by Beaufort force from
      0 (calm) to 12 (hurricane force).
  - page: wrftemp.html
    title: Temperature
    blurb: Screen-level (2 m) air temperature.
  - page: wrfutci.html
    title: UTCI
    blurb: >-
      Universal Thermal Climate Index: equivalent temperature accounting for
      humidity, wind and radiation as well as air temperature.
  - page: wrfcf.html
    title: Cloud Fraction
    blurb: Total column cloud cover.
  - page: wrfevap.html
    title: Accumulated Evaporation
    blurb: Actual evapotranspiration accumulated from model initialisation.
