# Keep the site's radar status honest without anyone having to remember to.
#
# Every half hour, .github/scripts/radar_status.py reads the Last-Modified
# header of the radar image on the data server and records online/offline in
# _data/radar_status.yml. Every radar mention on the site - the status badges,
# the offline notice, the home page layout - is driven by that file.
#
# It commits only when the status flips, when a scan happens while the radar is
# recorded as offline (so the banner's last-scan date stays true), and for a
# monthly keepalive - see the script. A radar that stays off adds next to
# nothing to the history, and the day it comes back the site follows within
# about half an hour.

name: Radar status

on:
  schedule:
    # Off the hour: GitHub queues scheduled runs on shared capacity and the top
    # of the hour is the busiest slot. Runs can still be delayed under load.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Standard library only, and ubuntu-latest ships Python 3. A failed
      # observation exits non-zero, which marks the run failed, but may still
      # have refreshed the monthly heartbeat - so the next step runs anyway.
      - name: Check the radar
        id: check
        run: python3 .github/scripts/radar_status.py

      - name: Record the change and rebuild the site
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stage first: plain `git diff` ignores an untracked file, so a status
          # file that had been deleted and was just recreated would be missed.
          git add -- _data/radar_status.yml
          if git diff --cached --quiet -- _data/radar_status.yml; then
            echo "Radar status unchanged."
            exit 0
          fi
          status=$(sed -n 's/^status: //p' _data/radar_status.yml)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Radar status: ${status}"
          git push || (git pull --rebase && git push)

          # A push made with the workflow token is not guaranteed to start a
          # Pages build, so request one explicitly. If it cannot be requested,
          # fail the run: a recorded status the site never shows is the one
          # outcome this job exists to prevent.
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null; then
              echo "Pages build requested."
              exit 0
            fi
            echo "Pages build request failed (attempt ${attempt}); retrying."
            sleep $((attempt * 15))
          done
          echo "::error::Could not request a Pages build; the status change is committed but not yet published."
          exit 1
