# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: NWU Lekwena Radar
short_title: Lekwena Radar
description: >-
  Live weather radar, WRF numerical forecasts and EUMETSAT satellite imagery
  from the North-West University Climatology Research Group, Potchefstroom.
tagline: Radar, numerical forecasting and satellite meteorology
lang: en

url: "https://www.lekwenaradar.co.za"
baseurl: ""

institution: North-West University
institution_url: "http://natural-sciences.nwu.ac.za/unit-environmental-sciences-and-management/climate-change-air-quality-and-impacts"
repository_url: "https://github.com/CRGGithub/crggithub.github.io"
contact_name: Dr Henno Havenga
contact_email: henno.havenga@nwu.ac.za

# ---------------------------------------------------------------------------
# Live data server
#
# Every radar image, WRF product and map served off the on-campus machine is
# addressed through `site.data_host`. It is deliberately the ONLY place the
# server address appears, so the raw IP never has to be published and the
# whole site can be repointed by editing this one line.
#
# Currently the campus hostname is used instead of the bare IP. To move to a
# vanity name, add a DNS A record (e.g. wrf.lekwenaradar.co.za -> the server)
# and change data_host to match. If TLS is ever terminated on that server,
# switch the scheme to https:// here and every embed on the site starts
# working for visitors on https as well - see data_host_secure below.
# ---------------------------------------------------------------------------
data_host: "http://fpt-unx.puk.ac.za"

# Set to true once the data server serves valid HTTPS. While false, the site
# swaps embedded radar/WRF frames for click-through cards when a visitor is on
# https://, because browsers block http:// content inside an https:// page.
data_host_secure: false

# ---------------------------------------------------------------------------
# Radar status
#
# MAINTAINER: this is the one thing on the site that a machine cannot work out
# for itself. The radar's timestamp is burnt into the GIF as pixels, and the
# server sends no CORS headers, so the browser cannot read how old a scan is.
# Set `status` by hand whenever the radar's state changes.
#
#   online  - scanning and publishing fresh images
#   limited - reachable but degraded (e.g. static image only, no live products)
#   offline - down for maintenance or fault
#
# `note` appears as a banner on the home and radar pages. Leave it blank for
# no banner.
# ---------------------------------------------------------------------------
radar:
  status: offline
  note: >-
    The radar is offline; the image below is its last scan, from 10 March 2026.
    WRF forecasts, station observations and satellite imagery are unaffected.

# Paths on the data server
data_paths:
  radar_gif: "/latest.gif"
  radar_storms: "/shpmap.html"
  radar_dbz: "/leaflet.html"
  stations: "/wrf/stations.html"
  wrf_portal: "/wrf/index.html"
  wrf_prefix: "/wrf/"

# ---------------------------------------------------------------------------
# Blitzortung.org live lightning map, embedded on the radar page
#
# Blitzortung is a volunteer-operated total-lightning detection network. The
# embed is served over https, so unlike the campus data server it loads inline
# here with no mixed-content fallback needed.
#
# TERMS (https://www.limaps.org/live-data.html): attribution is required, live
# data may not be demonstrated on commercial sites or via apps, and their
# websocket servers must not be hit from high-traffic pages. A non-commercial
# university research and teaching site is within that; keep it that way. The
# iframe is also lazy-loaded, so no connection is opened for a visitor who
# never scrolls to it.
#
# `embed` points at /en/ rather than the site root on purpose: the root is a
# JavaScript language redirector that picks the UI language from the visitor's
# browser, which would drop a German or French menu into an English page.
#
# `view` is the map hash: #zoom/latitude/longitude. It frames Southern Africa.
#
# The embed is deliberately NOT interactive. Their URL API has no maxBounds or
# minZoom parameter, so there is no way to let a visitor zoom while keeping
# them over Southern Africa - the only way to hold the frame on the region is
# to disable interaction outright (MapInteractive maps straight onto MapLibre's
# `interactive` flag). NavigationControl goes with it, because those buttons
# call map.zoomIn()/zoomOut() programmatically and would otherwise walk the
# view off the region regardless.
#
# `full_url` is the escape hatch: the same view on their own site, fully
# interactive, linked from the panel caption.
#
# `params` are documented at the link above. Most defaults are already right
# (strikes on, strike circles on, detector lines off, sound off) and are set
# explicitly anyway so a change of vendor default cannot alter this page.
# Note the vendor's own example switches Detector lines ON, which draws a web
# of lines from every strike to the stations that received it - not wanted.
#
#   MapStyle  0 satellite, 1 Blitzortung base map, 2 shaded relief
# ---------------------------------------------------------------------------
lightning:
  provider: Blitzortung.org
  provider_url: "https://www.blitzortung.org/"
  embed: "https://maps.blitzortung.org/en/"
  full_url: "https://maps.blitzortung.org/en/#5/-27.0/25.0"
  view: "#5/-27.0/25.0"
  params:
    # No cookie banner inside the frame, and no cookies set on our visitors.
    Cookies: 0
    CookiesPredefined: 0
    CookiesStatistics: 0
    CookiesAdvertisements: 0
    CookiesMaps: 0
    # Their own menu and info panels; we present the map, not their site.
    MenuDiv: 0
    InfoDiv: 0
    # Base map and projection.
    MapStyle: 1
    MapProjection: mercator
    MapLanguage: en
    # Locked to the Southern Africa frame - see the note above.
    MapInteractive: 0
    MapScrollZoom: 0
    MapDragRotate: 0
    MapTouchRotate: 0
    # Zoom buttons and the compass are off: the first would defeat the lock,
    # the second is meaningless with rotation disabled. Scale stays because it
    # tells the reader what they are looking at, and full screen stays because
    # it is the only way to see the frame properly on a phone.
    NavigationControl: 0
    NavigationControlCompass: 0
    ScaleControl: 1
    FullScreenControl: 1
    GlobeControl: 0
    GeolocateControl: 0
    # Data layers.
    LightningChecked: 1
    LightningRange: 23
    CirclesChecked: 1
    LinksChecked: 0
    DetectorsChecked: 0
    CoverageChecked: 0
    DayNightChecked: 0
    TimeZonesChecked: 0
    CountingChecked: 0
    AudioChecked: 0

# ---------------------------------------------------------------------------
# EUMETSAT WMS (view.eumetsat.int)
# ---------------------------------------------------------------------------
eumetsat:
  wms: "https://view.eumetsat.int/geoserver/wms"
  viewer: "https://view.eumetsat.int/productviewer"

# ---------------------------------------------------------------------------
# Navigation - explicit order beats alphabetical page discovery
# ---------------------------------------------------------------------------
nav:
  - title: Radar
    url: /radar.html
  - title: Stations
    url: /stations.html
  - title: WRF
    url: /wrf.html
  - title: Soundings
    url: /wrfskewt.html
  - title: Satellite
    url: /satellite.html
  - title: About
    url: /about.html

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

date_format: "%b %-d, %Y"

theme:

# Note: setting `exclude` replaces Jekyll's default list rather than adding to
# it, so the defaults are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - push_site.sh
  - reset_git.sh
