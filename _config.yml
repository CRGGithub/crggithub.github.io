# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: NWU Lekwena Radar
short_title: Lekwena Radar
description: >-
  Live weather radar, WRF numerical forecasts and EUMETSAT satellite imagery
  from the North-West University Climatology Research Group, Potchefstroom.
tagline: Radar, numerical forecasting and satellite meteorology
lang: en

url: "https://www.lekwenaradar.co.za"
baseurl: ""

institution: North-West University
institution_url: "http://natural-sciences.nwu.ac.za/unit-environmental-sciences-and-management/climate-change-air-quality-and-impacts"
repository_url: "https://github.com/CRGGithub/crggithub.github.io"
contact_name: Dr Henno Havenga
contact_email: henno.havenga@nwu.ac.za

# ---------------------------------------------------------------------------
# Live data server
#
# Every radar image, WRF product and map served off the on-campus machine is
# addressed through `site.data_host`. It is deliberately the ONLY place the
# server address appears, so the raw IP never has to be published and the
# whole site can be repointed by editing this one line.
#
# Currently the campus hostname is used instead of the bare IP. To move to a
# vanity name, add a DNS A record (e.g. wrf.lekwenaradar.co.za -> the server)
# and change data_host to match.
#
# While this is http://, browsers on the https site block every embed from it,
# and assets/js/site.js swaps each for a link that opens it in a new tab. Once
# the server has a TLS certificate, change the scheme here to https:// - that
# one edit is the whole switch, and every embed loads inline again.
# ---------------------------------------------------------------------------
data_host: "http://fpt-unx.puk.ac.za"

# ---------------------------------------------------------------------------
# Radar status
#
# Detected automatically. The radar-status workflow checks the radar image's
# Last-Modified header every half hour and records online/offline in
# _data/radar_status.yml; the badges, the offline notice and the home page
# layout all follow it. See .github/scripts/radar_status.py.
#
# `status` overrides the detection when set to anything other than auto:
#
#   auto    - follow the detected state (the normal setting)
#   online  - force online
#   limited - reachable but degraded, e.g. scanning but products unreliable
#   offline - force offline, e.g. images still arriving but known to be bad
#
# `note` replaces the automatic banner text. Leave it empty to let the site
# write its own, which for an offline radar gives the date of the last scan.
# ---------------------------------------------------------------------------
radar:
  status: auto
  note: ""

# Paths on the data server
data_paths:
  radar_gif: "/latest.gif"
  radar_storms: "/shpmap.html"
  radar_dbz: "/leaflet.html"
  stations: "/wrf/stations.html"
  wrf_portal: "/wrf/index.html"
  wrf_prefix: "/wrf/"

# ---------------------------------------------------------------------------
# Blitzortung.org live lightning map, embedded on the radar page
#
# Blitzortung is a volunteer-operated total-lightning detection network. The
# embed is served over https, so unlike the campus data server it loads inline
# here with no mixed-content fallback needed.
#
# TERMS (https://www.limaps.org/live-data.html): attribution is required, live
# data may not be demonstrated on commercial sites or via apps, and their
# websocket servers must not be hit from high-traffic pages. A non-commercial
# university research and teaching site is within that; keep it that way. The
# iframe is also lazy-loaded, so no connection is opened for a visitor who
# never scrolls to it.
#
# `embed` points at /en/ rather than the site root on purpose: the root is a
# JavaScript language redirector that picks the UI language from the visitor's
# browser, which would drop a German or French menu into an English page.
#
# `view` is the map hash: #zoom/latitude/longitude. It sets the opening view,
# framing Southern Africa; the visitor is free to pan and zoom from there.
#
# Note that the view cannot be *confined* to the region. Their URL API exposes
# no maxBounds or minZoom, so the only way to hold the frame would be to switch
# interaction off entirely (MapInteractive, which they pass straight to
# MapLibre's `interactive` flag) - which was tried and deliberately reverted.
#
# `params` are documented at the link above. Most defaults are already right
# (strikes on, strike circles on, detector lines off, sound off) and are set
# explicitly anyway so a change of vendor default cannot alter this page.
# Note the vendor's own example switches Detector lines ON, which draws a web
# of lines from every strike to the stations that received it - not wanted.
#
#   MapStyle  0 satellite, 1 Blitzortung base map, 2 shaded relief
# ---------------------------------------------------------------------------
lightning:
  provider: Blitzortung.org
  provider_url: "https://www.blitzortung.org/"
  embed: "https://maps.blitzortung.org/en/"
  view: "#5/-27.0/25.0"
  params:
    # No cookie banner inside the frame, and no cookies set on our visitors.
    Cookies: 0
    CookiesPredefined: 0
    CookiesStatistics: 0
    CookiesAdvertisements: 0
    CookiesMaps: 0
    # Their own menu and info panels; we present the map, not their site.
    MenuDiv: 0
    InfoDiv: 0
    # Base map and projection.
    MapStyle: 1
    MapProjection: mercator
    MapLanguage: en
    # Pan and zoom stay on. Scroll zoom does not: a map that swallows the
    # page scroll as the reader passes over it is worse than one that needs a
    # button. Rotation is off so north stays up.
    MapInteractive: 1
    MapScrollZoom: 0
    MapDragRotate: 0
    MapTouchRotate: 0
    # Zoom buttons are the way in without scroll zoom, so they stay, as do the
    # scale bar and full screen. No compass (rotation is disabled), no globe,
    # and no geolocation, which would prompt the visitor for their position.
    NavigationControl: 1
    NavigationControlCompass: 0
    ScaleControl: 1
    FullScreenControl: 1
    GlobeControl: 0
    GeolocateControl: 0
    # Data layers.
    LightningChecked: 1
    LightningRange: 23
    CirclesChecked: 1
    LinksChecked: 0
    DetectorsChecked: 0
    CoverageChecked: 0
    DayNightChecked: 0
    TimeZonesChecked: 0
    CountingChecked: 0
    AudioChecked: 0

# ---------------------------------------------------------------------------
# EUMETSAT WMS (view.eumetsat.int)
# ---------------------------------------------------------------------------
eumetsat:
  wms: "https://view.eumetsat.int/geoserver/wms"
  viewer: "https://view.eumetsat.int/productviewer"

# ---------------------------------------------------------------------------
# Navigation - explicit order beats alphabetical page discovery
# ---------------------------------------------------------------------------
nav:
  - title: Radar
    url: /radar.html
  - title: Stations
    url: /stations.html
  - title: WRF
    url: /wrf.html
  - title: Soundings
    url: /wrfskewt.html
  - title: Satellite
    url: /satellite.html
  - title: About
    url: /about.html

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

date_format: "%b %-d, %Y"

theme:

# Note: setting `exclude` replaces Jekyll's default list rather than adding to
# it, so the defaults are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - push_site.sh
  - reset_git.sh
  # Legacy radar tile pyramid and its three viewers. Nothing links to them,
  # the Leaflet viewer has unresolved merge markers, all three load http
  # scripts, and the Google one has a placeholder key. Kept in the repository,
  # not published. Written as a glob on purpose: Jekyll also matches exclude
  # entries as plain path prefixes, so "assets/images/radar/radar" would drop
  # radar/radardbz.png too - the colour scale the radar page shows. The /*
  # cannot match that file under any Jekyll version's path normalisation.
  - "assets/images/radar/radar/*"
