{%- include radar-state.html -%}
{%- if radar_note != '' -%}
<aside class="callout callout--warn" role="status">
  <div class="callout__body">
    <p class="callout__title">
      {%- if radar_status == 'offline' -%}Radar offline
      {%- elsif radar_status == 'limited' -%}Radar running in a limited mode
      {%- else -%}Radar notice{%- endif -%}
    </p>
    <p>{{ radar_note }}</p>
  </div>
</aside>
{%- endif -%}
