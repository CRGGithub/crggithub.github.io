{%- comment -%}
  Radar status badge. The state comes from _includes/radar-state.html.
{%- endcomment -%}
{%- include radar-state.html -%}
{%- case radar_status -%}
  {%- when 'online' -%}
    <span class="badge badge--ok"><span class="dot dot--pulse"></span> Online</span>
  {%- when 'offline' -%}
    <span class="badge badge--bad"><span class="dot"></span> Offline</span>
  {%- else -%}
    <span class="badge"><span class="dot"></span> Limited</span>
{%- endcase -%}
