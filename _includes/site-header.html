<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">
        <!-- Concentric radar sweep -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="3.6"></circle>
          <path d="M12 12 18.3 7.1"></path>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">{{ site.short_title | escape }}</span>
        <span class="brand__sub">{{ site.institution | escape }}</span>
      </span>
    </a>

    <button class="icon-btn nav-toggle" type="button"
            aria-expanded="false" aria-controls="primary-nav" aria-label="Menu"
            data-nav-toggle>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </svg>
    </button>

    <nav class="nav" id="primary-nav" aria-label="Primary">
      {%- for item in site.nav -%}
        {%- assign target = item.url | relative_url -%}
        <a class="nav__link" href="{{ target }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>

    <button class="icon-btn" type="button" data-theme-toggle
            aria-label="Switch between light and dark theme" title="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>
</header>
